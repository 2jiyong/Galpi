services:
  postgres:
    image: postgres:18-alpine
    container_name: galpi-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-galpi}
      POSTGRES_USER: ${DB_USERNAME:-galpi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-galpi}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - galpi-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  galpi-postgres-data:
